name: CI/CD Workflow

on:
  push:
    branches:
      - 'develop'
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'docs/**'
      - 'style/**'
      - 'test/**'
      - 'deploy/**'
      - 'hotfix/**'
      - 'chore/**'

      - 'main'
  pull_request:
    branches:
      - 'develop'
      - 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 패키지 설치
        run: pnpm install --frozen-lockfile

      - name: 린트 검사
        run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 패키지 설치
        run: pnpm install --frozen-lockfile

      - name: 빌드 테스트
        run: pnpm run build

      # 테스트가 있다면 여기에 추가
      # - name: 테스트 실행
      #   run: pnpm test

  deploy-preview:
    needs: [lint, build]
    if: |
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Vercel CLI 설치
        run: npm install -g vercel@latest

      - name: Vercel 미리보기 배포
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: PR에 미리보기 URL 댓글 달기
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.deploy.outputs.url }}';
            const branch = context.payload.pull_request.head.ref;
            const sha = context.payload.pull_request.head.sha;
            const comment =
              `미리보기 배포 완료\n\n` +
              `배포 URL: ${deployUrl}\n` +
              `브랜치: ${branch}\n` +
              `커밋: ${sha}`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  deploy-production:
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Vercel CLI 설치
        run: npm install -g vercel@latest

      - name: Vercel 운영 배포
        id: deploy-prod
        run: |
          DEPLOY_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 운영 배포 완료 알림
        run: |
          echo "🎉 운영 환경에 배포가 완료되었습니다!"
          echo "📝 배포 URL: ${{ steps.deploy-prod.outputs.url }}"
